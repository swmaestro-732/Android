name: CI

# ─────────────────────────────────────────────────────────────────────────────
# 안드로이드 CI — PR 마다 포맷(ktlint) / 빌드·유닛테스트·Android Lint·Kover /
# 시크릿 스캔을 돌리고 결과를 단일 PR 코멘트로 통합한다.
#
# ✅ 의존성 "버전 업데이트": Dependabot 배선 완료(.github/dependabot.yml — gradle·github-actions).
# ⏭️  의존성 "CVE 보안 알림"은 아직 없음(후순위). 필요해지면:
#     1) 저장소 Settings → Code security → "Dependabot alerts" 활성화
#     2) .github/workflows/dependency-submission.yml 생성 후 아래 액션 추가:
#          - uses: gradle/actions/dependency-submission@v4   # Gradle 의존성 그래프 제출(lockfile 불필요)
#        → Security 탭에 CVE 알림 생성(버전 업데이트 PR 은 위 dependabot.yml 이 이미 담당).
#     ※ PR 을 "차단"하는 하드 게이트가 필요해지면 OSV-Scanner + gradle.lockfile 로 승격.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# 최소 권한 (report 코멘트 작성을 위해 pull-requests: write 만 부여)
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: "1.8.0"
  GITLEAKS_VERSION: "8.18.4"

# ※ 액션은 태그(major 버전)로 참조한다. 공급망 강화를 위해 SHA 핀이 필요해지면 별도 도입한다.

jobs:
  # 1) 포맷 검사 — pre-commit 과 동일한 .editorconfig 룰을 그대로 사용
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download ktlint ${{ env.KTLINT_VERSION }}
        run: |
          curl -fsSL "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint" -o ktlint
          chmod +x ktlint
      - name: Run ktlint
        # .editorconfig(리포 루트)를 자동으로 읽어 로컬 pre-commit 과 100% 동일 룰 적용
        run: ./ktlint --relative

  # 2) 정적분석 — Detekt(코드 스멜/복잡도). 기존 위반은 모듈별 baseline 으로 동결,
  #    새 위반이 생기면 차단. ktlint(포맷)와 역할 분리.
  detekt:
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run detekt
        run: ./gradlew detekt --stacktrace
      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/**"
          if-no-files-found: ignore

  # 3) 빌드 + 유닛테스트 + Android Lint + Kover 커버리지
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk 37 platform 이 러너에 없으면 AGP 가 자동 다운로드한다.
      # 만약 SDK 관련 실패 시: android-actions/setup-android@v3 스텝 추가.
      - name: Build + Unit test + Android Lint + Kover
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug koverXmlReport --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.*
            **/build/reports/kover/**
          if-no-files-found: ignore

  # 4) 코드 보안 — Gitleaks 시크릿 스캔(전용 툴). 시크릿 발견 시 차단.
  #    의존성 CVE 는 Dependabot 이 담당하므로 시크릿 탐지만 이 잡에서 전담(역할 분리).
  #    저장소 Settings → Code security 의 GitHub Secret Scanning + Push Protection 과 병행.
  #    ktlint 와 동일하게 릴리스 바이너리를 직접 받아 org 라이선스 의존 없이 실행한다.
  code-security:
    name: code security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # git 히스토리 전체를 스캔하려면 얕은 클론이 아니어야 한다
      - name: Download gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run gitleaks (차단)
        # detect: 워킹트리 + git 히스토리 스캔. --redact 로 로그에 실제 시크릿 노출 방지.
        # 시크릿 발견 시 exit 1 로 CI 실패(차단).
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  # 5) 결과 통합 — 단일 <!-- ci-report --> PR 코멘트로 upsert (실패해도 항상 실행)
  ci-report:
    name: CI report
    runs-on: ubuntu-latest
    needs: [ktlint, detekt, build-and-test, code-security]
    if: always()
    steps:
      - name: Compose report
        id: report
        run: |
          status() {
            case "$1" in
              success) echo "✅ Pass" ;;
              failure) echo "❌ Fail" ;;
              skipped) echo "⏭️ Skip" ;;
              *) echo "⚠️ $1" ;;
            esac
          }
          {
            echo "body<<REPORT_EOF"
            echo "<!-- ci-report -->"
            echo "## 🤖 CI 결과"
            echo ""
            echo "| 잡 | 결과 |"
            echo "|---|---|"
            echo "| ktlint | $(status '${{ needs.ktlint.result }}') |"
            echo "| detekt | $(status '${{ needs.detekt.result }}') |"
            echo "| build & test (+Kover) | $(status '${{ needs.build-and-test.result }}') |"
            echo "| code security | $(status '${{ needs.code-security.result }}') |"
            echo ""
            echo "상세 로그·리포트 아티팩트: [워크플로 실행](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upsert PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-report
          message: ${{ steps.report.outputs.body }}
