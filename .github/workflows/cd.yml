name: Play version inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Read current Play version codes only
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_FILE"
          for track in production beta alpha internal; do
            echo "Inspecting track: $track"
            bundle exec fastlane run google_play_track_version_codes package_name:com.chillsam.courmy track:"$track" json_key:"$PLAY_JSON_KEY_FILE"
          done
