name: iOS merge notification tests

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/notify_ios_merge.py'
      - 'scripts/test_notify_ios_merge.py'
      - '.github/workflows/ios-merge-notification*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_notify_ios_merge.py' -v
