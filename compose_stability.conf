# Compose Compiler Stability Configuration
#
# 여기 등록된 클래스는 Compose 컴파일러가 @Stable 로 취급한다 (불필요한 recomposition 방지).
# 참고: docs/architecture/module-structure.md 의 "compose_stability.conf" 절.
#
# 등록 기준:
#   - 모든 필드가 val + 원시타입/enum/String 인 entity VO
#   - 새 VO 를 Compose 파라미터로 쓰면 여기에 FQN 한 줄 추가
#
# 불필요:
#   - kotlinx.collections.immutable.* 는 기본 stable → 등록 불필요
#     (UIState 컬렉션은 항상 ImmutableList/ImmutableSet 사용)
#
# 예) com.chillsam.courmy.common.entity.media.MediaVO
